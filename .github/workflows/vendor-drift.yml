name: Vendor format drift

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      direction:
        description: Probe direction
        required: true
        default: round-trip
        type: choice
        options:
          - round-trip
          - claude-to-codex
          - codex-to-claude

permissions:
  contents: read

concurrency:
  group: vendor-format-drift
  cancel-in-progress: false

jobs:
  live-probe:
    # Live probes require a Mac already authenticated to both vendor CLIs. Set
    # ENABLE_VENDOR_DRIFT=true only after attaching the labelled private runner.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_VENDOR_DRIFT == 'true'
    runs-on:
      - self-hosted
      - macOS
      - agent-switch-drift
    timeout-minutes: 20
    env:
      NO_UPDATE_NOTIFIER: "1"
      DRIFT_DIRECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.direction || 'round-trip' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Report installed agents
        run: |
          claude --version
          if command -v codex >/dev/null 2>&1; then
            codex --version
          else
            /Applications/ChatGPT.app/Contents/Resources/codex --version
          fi

      - name: Run authenticated native round-trip probe
        run: python3 tools/verify-drift.py --json --direction "$DRIFT_DIRECTION"
